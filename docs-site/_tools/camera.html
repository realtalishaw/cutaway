<!doctype html>
<html><head><meta charset="utf-8">
<style>* { margin: 0 } body { width: 1280px; height: 720px; overflow: hidden; background: #000 }</style></head>
<body>
<svg id="v" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dcc8"/><stop offset="1" stop-color="#e6c3b0"/></linearGradient>
    <radialGradient id="lamp" cx="0.2" cy="0.25" r="0.6"><stop offset="0" stop-color="#fff4d6" stop-opacity=".8"/><stop offset="1" stop-color="#fff4d6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect width="1280" height="720" fill="url(#lamp)"/>
  <!-- shelf -->
  <rect x="860" y="190" width="330" height="14" rx="4" fill="#a8775a"/>
  <rect x="880" y="120" width="26" height="70" rx="3" fill="#6d4aff"/><rect x="910" y="132" width="22" height="58" rx="3" fill="#ff7ab6"/><rect x="936" y="112" width="30" height="78" rx="3" fill="#4cc38a"/>
  <circle cx="1120" cy="160" r="30" fill="#5b9e6a"/><circle cx="1095" cy="150" r="22" fill="#6fb77d"/><rect x="1095" y="168" width="50" height="22" rx="6" fill="#d9825b"/>
  <!-- plant -->
  <path d="M120 720 L140 560 L230 560 L250 720 Z" fill="#d9825b"/>
  <g fill="#5b9e6a"><ellipse cx="150" cy="500" rx="30" ry="80" transform="rotate(-25 150 500)"/><ellipse cx="220" cy="490" rx="30" ry="85" transform="rotate(20 220 490)"/><ellipse cx="185" cy="470" rx="26" ry="95"/></g>
  <g id="person">
    <!-- body -->
    <path d="M390 720 C400 560 500 510 640 510 C780 510 880 560 890 720 Z" fill="#6d4aff"/>
    <path d="M590 510 L640 580 L690 510 Z" fill="#f2f0ff"/>
    <rect x="605" y="440" width="70" height="90" rx="30" fill="#b9805f"/>
    <!-- hair back -->
    <ellipse cx="640" cy="300" rx="175" ry="190" fill="#2b1d1a"/>
    <!-- face -->
    <ellipse cx="640" cy="330" rx="135" ry="160" fill="#c88d69"/>
    <ellipse cx="505" cy="340" rx="20" ry="32" fill="#b9805f"/><ellipse cx="775" cy="340" rx="20" ry="32" fill="#b9805f"/>
    <!-- hair top -->
    <path d="M495 290 C500 160 600 130 660 140 C760 150 800 220 790 300 C760 230 700 200 620 210 C560 215 520 250 495 290 Z" fill="#2b1d1a"/>
    <!-- eyes -->
    <g id="eyes" fill="#2b1d1a"><ellipse cx="585" cy="320" rx="13" ry="15"/><ellipse cx="695" cy="320" rx="13" ry="15"/></g>
    <path d="M560 285 Q585 272 610 283" stroke="#2b1d1a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M670 283 Q695 272 720 285" stroke="#2b1d1a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="560" cy="380" rx="22" ry="12" fill="#e58f7a" opacity=".5"/><ellipse cx="720" cy="380" rx="22" ry="12" fill="#e58f7a" opacity=".5"/>
    <path d="M640 330 Q632 362 646 368" stroke="#a46b4f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- mouth -->
    <path id="mouth" fill="#7a2e2a"/>
  </g>
</svg>
<script>
let L = [];
window.setup = (tm) => { L = tm.lines; };
window.render = (t) => {
  const talking = L.some((l) => t >= l.start && t <= l.end);
  const open = talking ? 6 + 18 * Math.abs(Math.sin(t * 13) * Math.sin(t * 5.3 + 1)) : 2;
  const smile = talking ? 4 : 10;
  document.getElementById('mouth').setAttribute('d', `M600 410 Q640 ${410 + smile} 680 410 Q640 ${410 + smile + open} 600 410 Z`);
  const blink = (t % 3.7) < 0.12;
  document.getElementById('eyes').setAttribute('transform', blink ? 'translate(0 288) scale(1 .1)' : '');
  const bob = Math.sin(t * 1.6) * 4 + (talking ? Math.sin(t * 6) * 2 : 0);
  document.getElementById('person').setAttribute('transform', `translate(${Math.sin(t * 0.7) * 6} ${bob}) rotate(${Math.sin(t * 0.9) * 1.2} 640 600)`);
};
</script></body></html>
