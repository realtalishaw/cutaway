<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; background: #f6f5fb; color: #1d1b2e; }
  .top { height: 76px; background: #fff; border-bottom: 1px solid #e7e4f2; display: flex; align-items: center; padding: 0 36px; gap: 14px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #7c5cff, #ff7ab6); }
  .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .grow { flex: 1; }
  .share { background: #6d4aff; color: #fff; border-radius: 12px; padding: 12px 26px; font-size: 20px; font-weight: 600; opacity: .35; }
  .share.on { opacity: 1; }
  .me { width: 42px; height: 42px; border-radius: 50%; background: #ffd27a; display: grid; place-items: center; font-weight: 700; }
  .side { position: absolute; top: 76px; left: 0; bottom: 0; width: 360px; background: #fbfaff; border-right: 1px solid #e7e4f2; padding: 34px 24px; }
  .side h4 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.2px; color: #8c87a6; margin: 0 12px 16px; }
  .li { font-size: 21px; padding: 15px 16px; border-radius: 12px; display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
  .li.sel { background: #ece6ff; color: #4b2fd6; font-weight: 600; }
  .new { position: absolute; left: 24px; right: 24px; bottom: 40px; border: 2px dashed #cfc6f5; color: #6d4aff; border-radius: 14px; padding: 18px; font-size: 21px; font-weight: 600; text-align: center; }
  .new.press { background: #ece6ff; }
  .main { position: absolute; top: 76px; left: 360px; right: 0; bottom: 0; padding: 70px 110px; }
  .empty { text-align: center; margin-top: 260px; color: #8c87a6; font-size: 26px; }
  .empty b { display: block; font-size: 64px; margin-bottom: 18px; }
  .title { font-size: 56px; font-weight: 700; letter-spacing: -1px; min-height: 72px; border-bottom: 3px solid transparent; display: inline-block; padding-right: 6px; }
  .title.focus { border-color: #6d4aff; }
  .title .ph { color: #c4bfd9; }
  .caret { display: inline-block; width: 3px; height: 54px; background: #6d4aff; vertical-align: -8px; margin-left: 2px; }
  .sub { color: #8c87a6; font-size: 20px; margin: 14px 0 44px; }
  .item { display: flex; align-items: center; gap: 20px; font-size: 30px; padding: 22px 26px; background: #fff; border: 1px solid #ece9f6; border-radius: 16px; margin-bottom: 14px; width: 900px; box-shadow: 0 2px 8px rgba(40,20,120,.04); }
  .box { width: 30px; height: 30px; border: 2.5px solid #cfc6f5; border-radius: 9px; }
  .add { display: flex; align-items: center; gap: 20px; font-size: 28px; padding: 22px 26px; border: 2px dashed #ddd6f8; border-radius: 16px; width: 900px; color: #b3acd0; }
  .add.focus { border-style: solid; border-color: #6d4aff; color: #1d1b2e; background: #fff; }
  .pop { position: absolute; top: 92px; right: 96px; width: 380px; background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(40,20,120,.18); padding: 18px; border: 1px solid #ece9f6; }
  .pop h5 { font-size: 18px; color: #8c87a6; margin: 6px 10px 12px; font-weight: 600; }
  .friend { display: flex; align-items: center; gap: 16px; padding: 14px 12px; border-radius: 12px; font-size: 22px; }
  .friend.hover { background: #f1edff; }
  .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .toast { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: #1d1b2e; color: #fff; font-size: 24px; padding: 20px 34px; border-radius: 16px; display: flex; gap: 14px; align-items: center; }
  .cursor { position: absolute; width: 34px; height: 44px; pointer-events: none; transform-origin: 4px 4px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); z-index: 9; }
  .ring { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #6d4aff; z-index: 8; }
</style></head>
<body>
<div class="top"><div class="logo"></div><div class="brand">Listful</div><div class="grow"></div><div class="share" id="share">Share</div><div class="me">T</div></div>
<div class="side"><h4>My lists</h4>
  <div class="li">📚 Book club picks</div><div class="li">🎁 Gift ideas</div><div class="li">🏕️ Camping trip</div>
  <div id="newli"></div>
  <div class="new" id="new">+ New list</div>
</div>
<div class="main" id="main"></div>
<div id="pop"></div><div id="toast"></div><div class="ring" id="ring" style="display:none"></div>
<svg class="cursor" id="cur" viewBox="0 0 34 44"><path d="M4 3 L4 35 L12 27 L18 41 L24 38 L18 25 L29 25 Z" fill="#111" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>
<script>
let L, K = [], CLICKS = [];
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const s = (i) => L[i].start, e = (i) => L[i].end;
window.setup = (tm) => {
  L = tm.lines;
  // cursor keyframes: [time, x, y]
  K = [[0, 1100, 640], [s(1) - 0.2, 1100, 640], [s(1) + 0.9, 190, 1005], [e(1) + 0.4, 190, 1005], [s(3) + 0.3, 760, 225], [s(4) + 0.2, 760, 225], [s(4) + 1.1, 700, 345], [s(6) + 0.3, 700, 470], [s(6) + 1.3, 1772, 40], [s(6) + 2.1, 1772, 40], [s(6) + 2.9, 1560, 188], [99, 1560, 188]];
  CLICKS = [s(1) + 1.05, s(4) + 1.25, s(6) + 1.45, s(6) + 3.05];
};
function cursorAt(t) {
  for (let k = 0; k < K.length - 1; k++) {
    const [t0, x0, y0] = K[k], [t1, x1, y1] = K[k + 1];
    if (t >= t0 && t <= t1) { const p = ease((t - t0) / (t1 - t0 || 1)); return [x0 + (x1 - x0) * p, y0 + (y1 - y0) * p]; }
  }
  return [K[K.length - 1][1], K[K.length - 1][2]];
}
const typed = (str, t0, t, rate = 0.07) => (t < t0 ? '' : str.slice(0, Math.floor((t - t0) / rate) + 1));
window.render = (t) => {
  const made = t >= CLICKS[0];
  const [x, y] = cursorAt(t);
  const cur = document.getElementById('cur');
  const ck = CLICKS.find((c) => t >= c && t < c + 0.45);
  cur.style.left = x - 4 + 'px'; cur.style.top = y - 4 + 'px';
  cur.style.transform = ck !== undefined && t < ck + 0.12 ? 'scale(.85)' : 'scale(1)';
  const ring = document.getElementById('ring');
  if (ck !== undefined) { const p = (t - ck) / 0.45; ring.style.display = 'block'; ring.style.left = x - 30 + 'px'; ring.style.top = y - 30 + 'px'; ring.style.opacity = 1 - p; ring.style.transform = `scale(${0.4 + p})`; } else ring.style.display = 'none';
  document.getElementById('new').className = 'new' + (t >= CLICKS[0] && t < CLICKS[0] + 0.3 ? ' press' : '');
  const titleStart = s(3) + 1.25;
  const title = typed('Weekend groceries', titleStart, t, 0.075);
  document.getElementById('newli').innerHTML = made ? `<div class="li sel">🛒 ${title || 'Untitled list'}</div>` : '';
  const items = [['🥚', 'Eggs', s(5) + 0.05], ['🥛', 'Milk', s(5) + 0.8], ['🍓', 'Strawberries', s(5) + 1.9]];
  const addOn = t >= CLICKS[1];
  let typing = '';
  const shown = items.filter(([, name, at]) => { const doneAt = at + name.length * 0.06 + 0.15; if (t >= at && t < doneAt) typing = name.slice(0, Math.floor((t - at) / 0.06) + 1); return t >= doneAt; });
  document.getElementById('main').innerHTML = !made
    ? `<div class="empty"><b>🗒️</b>Pick a list, or make a new one.</div>`
    : `<div class="title ${t < s(4) ? 'focus' : ''}">${title ? title : '<span class="ph">Untitled list</span>'}${t < s(4) && Math.floor(t * 2) % 2 === 0 ? '<span class="caret"></span>' : ''}</div>
       <div class="sub">${shown.length} item${shown.length === 1 ? '' : 's'} · just you</div>
       ${shown.map(([em, n]) => `<div class="item"><div class="box"></div>${em} ${n}</div>`).join('')}
       <div class="add ${addOn && t < s(6) + 0.5 ? 'focus' : ''}">＋ ${typing || (addOn && t < s(6) + 0.5 ? '<span style="color:#b3acd0">Type an item, then press Enter</span>' : 'Add an item')}</div>`;
  document.getElementById('share').className = 'share' + (shown.length ? ' on' : '');
  const popOpen = t >= CLICKS[2] && t < CLICKS[3] + 0.4;
  const hover = t >= s(6) + 2.6;
  document.getElementById('pop').innerHTML = popOpen
    ? `<div class="pop"><h5>Share “${title}” with…</h5>
        <div class="friend ${hover ? 'hover' : ''}"><div class="av" style="background:#4cc38a">S</div>Sam</div>
        <div class="friend"><div class="av" style="background:#f08a5d">P</div>Priya</div>
        <div class="friend"><div class="av" style="background:#5d8af0">J</div>Jordan</div></div>`
    : '';
  document.getElementById('toast').innerHTML = t >= CLICKS[3] + 0.4 ? `<div class="toast">✅ Shared with Sam</div>` : '';
};
</script></body></html>
