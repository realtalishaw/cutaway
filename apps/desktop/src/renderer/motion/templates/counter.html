<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Counter</title>
<script type="application/json" id="cutaway-motion">
{
  "name": "Counter",
  "description": "A big number counts up with a label under it, then a ding lands on the final value.",
  "duration": 3.6,
  "fields": [
    { "id": "target", "label": "Count to", "type": "number", "default": "10000" },
    { "id": "prefix", "label": "Before the number", "type": "text", "default": "" },
    { "id": "suffix", "label": "After the number", "type": "text", "default": "+" },
    { "id": "label", "label": "Label", "type": "text", "default": "views" },
    { "id": "accent", "label": "Colour", "type": "color", "default": "#ffd400" }
  ],
  "sounds": [{ "t": 0.2, "sound": "riser", "gain": 0.35 }, { "t": 1.7, "sound": "ding", "gain": 0.5 }]
}
</script>
<style>
  html, body { width: 100%; height: 100%; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: calc(min(100vw, 100vh) * 0.05); }
  #wrap { position: absolute; left: 0; right: 0; top: 34%; text-align: center; color: #fff; text-shadow: 0 0.06em 0.3em rgba(0, 0, 0, 0.55); }
  #num { display: block; font-weight: 900; font-size: 3.4em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
  #label { display: inline-block; margin-top: 0.3em; font-weight: 700; font-size: 1.1em; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
</head>
<body>
  <div id="wrap"><b id="num">0</b><span id="label" data-field="label">views</span></div>
  <script>
    const D = 3600, at = (s) => s / 3.6;
    const f = window.__fields || {};
    const target = Math.max(0, Number(String(f.target ?? '10000').replace(/[^0-9.]/g, '')) || 0);
    const num = document.getElementById('num');
    document.getElementById('wrap').animate([
      { offset: 0, transform: 'scale(0.7)', opacity: 0 },
      { offset: at(0.25), transform: 'scale(1.04)', opacity: 1, easing: 'ease-out' },
      { offset: at(0.45), transform: 'scale(1)' },
      { offset: at(1.68), transform: 'scale(1)' },
      { offset: at(1.78), transform: 'scale(1.08)' },
      { offset: at(1.95), transform: 'scale(1)' },
      { offset: at(3.15), transform: 'scale(1)', opacity: 1, easing: 'ease-in' },
      { offset: 1, transform: 'scale(0.9)', opacity: 0 },
    ], { duration: D, fill: 'both' });
    // the count is drawn from the time: it eases out and lands on the target at 1.7 s
    window.__render = (t) => {
      const p = Math.min(1, Math.max(0, (t - 0.2) / 1.5));
      const eased = 1 - Math.pow(1 - p, 3);
      const v = Math.round(target * eased);
      num.textContent = (f.prefix || '') + v.toLocaleString('en-US') + (p >= 1 ? f.suffix || '' : '');
    };
  </script>
</body>
</html>
