<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Highlighter</title>
<script type="application/json" id="cutaway-motion">
{
  "name": "Highlighter",
  "description": "A marker stroke sweeps across the box, Vox style. Put the box over the words to highlight.",
  "duration": 3,
  "placement": "box",
  "box": { "x": 0.3, "y": 0.44, "w": 0.4, "h": 0.1 },
  "fields": [{ "id": "colour", "label": "Marker colour", "type": "color", "default": "#ffe14a" }],
  "sounds": [{ "t": 0.1, "sound": "swish", "gain": 0.5 }]
}
</script>
<style>
  /* The page is the box: the stroke fills it. */
  html, body { width: 100%; height: 100%; }
  #band { position: absolute; left: -2%; right: -2%; top: 12%; bottom: 12%; background: var(--colour); opacity: 0.5; border-radius: 0.4vh 1.2vh 0.6vh 1.4vh; transform: rotate(-0.6deg); }
</style>
</head>
<body>
  <div id="band"></div>
  <script>
    const at = (s) => s / 3;
    document.getElementById('band').animate([
      { offset: 0, clipPath: 'inset(0 100% 0 0)', opacity: 0.5 },
      { offset: at(0.12), clipPath: 'inset(0 100% 0 0)', easing: 'cubic-bezier(.3,.7,.2,1)' },
      { offset: at(0.62), clipPath: 'inset(0 0% 0 0)' },
      { offset: at(2.55), clipPath: 'inset(0 0% 0 0)', opacity: 0.5 },
      { offset: 1, clipPath: 'inset(0 0% 0 0)', opacity: 0 },
    ], { duration: 3000, fill: 'both' });
  </script>
</body>
</html>
