<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Title card</title>
<script type="application/json" id="cutaway-motion">
{
  "name": "Title card",
  "description": "A chapter title with a small label above it, on a soft dark band across the middle of the frame.",
  "duration": 3.5,
  "fields": [
    { "id": "kicker", "label": "Label", "type": "text", "default": "Chapter 2" },
    { "id": "title", "label": "Title", "type": "text", "default": "Getting set up" },
    { "id": "accent", "label": "Accent colour", "type": "color", "default": "#7258ff" }
  ],
  "sounds": [{ "t": 0.15, "sound": "whoosh", "gain": 0.45 }, { "t": 0.45, "sound": "thud", "gain": 0.4 }]
}
</script>
<style>
  html, body { width: 100%; height: 100%; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: calc(min(100vw, 100vh) * 0.05); }
  #band { position: absolute; left: 0; right: 0; top: 30%; height: 40%; background: linear-gradient(180deg, rgba(8, 9, 13, 0), rgba(8, 9, 13, 0.62) 25%, rgba(8, 9, 13, 0.62) 75%, rgba(8, 9, 13, 0)); }
  #text { position: absolute; left: 8%; right: 8%; top: 50%; transform: translateY(-50%); text-align: center; color: #fff; }
  #kicker { display: inline-block; padding: 0.25em 0.7em; border-radius: 999px; background: var(--accent); font-weight: 700; font-size: 0.7em; letter-spacing: 0.1em; text-transform: uppercase; }
  #title { display: block; margin-top: 0.35em; font-weight: 850; font-size: 2.1em; line-height: 1.05; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div id="band"></div>
  <div id="text"><span id="kicker" data-field="kicker">Chapter 2</span><b id="title" data-field="title">Getting set up</b></div>
  <script>
    const D = 3500, at = (s) => s / 3.5;
    const run = (id, frames) => document.getElementById(id).animate(frames, { duration: D, fill: 'both' });
    run('band', [{ offset: 0, opacity: 0 }, { offset: at(0.3), opacity: 1 }, { offset: at(3.0), opacity: 1 }, { offset: 1, opacity: 0 }]);
    run('kicker', [{ offset: 0, opacity: 0, transform: 'translateY(0.6em)' }, { offset: at(0.15), opacity: 0, transform: 'translateY(0.6em)', easing: 'cubic-bezier(.2,.8,.2,1)' }, { offset: at(0.5), opacity: 1, transform: 'translateY(0)' }, { offset: at(3.0), opacity: 1, transform: 'translateY(0)' }, { offset: 1, opacity: 0, transform: 'translateY(-0.3em)' }]);
    run('title', [{ offset: 0, opacity: 0, transform: 'translateY(0.5em) scale(0.96)', filter: 'blur(0.2em)' }, { offset: at(0.3), opacity: 0, transform: 'translateY(0.5em) scale(0.96)', filter: 'blur(0.2em)', easing: 'cubic-bezier(.2,.8,.2,1)' }, { offset: at(0.75), opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0)' }, { offset: at(3.0), opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0)' }, { offset: 1, opacity: 0, transform: 'translateY(-0.2em) scale(1)', filter: 'blur(0.1em)' }]);
  </script>
</body>
</html>
