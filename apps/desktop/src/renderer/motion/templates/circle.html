<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Circle it</title>
<script type="application/json" id="cutaway-motion">
{
  "name": "Circle it",
  "description": "A hand-drawn circle draws itself around the box. Put the box around what you are talking about.",
  "duration": 3,
  "placement": "box",
  "box": { "x": 0.4, "y": 0.36, "w": 0.2, "h": 0.2 },
  "fields": [{ "id": "colour", "label": "Pen colour", "type": "color", "default": "#ff3b30" }],
  "sounds": [{ "t": 0.1, "sound": "swish", "gain": 0.5 }]
}
</script>
<style>
  html, body { width: 100%; height: 100%; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script>
    // The stroke is drawn on a canvas in real pixels, so it looks the same in a box of any shape.
    const cv = document.getElementById('cv');
    const g = cv.getContext('2d');
    const ease = (p) => (p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3));
    /** Points along a cubic Bézier in box fractions, as pixels. */
    function bezier(W, H, a, b, c, d, n = 80) {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n, u = 1 - t;
        const x = u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0];
        const y = u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1];
        pts.push([x * W, y * H]);
      }
      return pts;
    }
    /** Stroke the first `frac` of a polyline (by length). Returns the last point drawn and its direction. */
    function strokePart(pts, frac) {
      let total = 0;
      for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      let left = total * frac;
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      let end = pts[0], dir = [1, 0];
      for (let i = 1; i < pts.length && left > 0; i++) {
        const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        const k = Math.min(1, left / seg);
        end = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k];
        dir = [pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]];
        g.lineTo(end[0], end[1]);
        left -= seg;
      }
      g.stroke();
      return { end, dir };
    }
    function pen(W, H, alpha) {
      g.clearRect(0, 0, W, H);
      const colour = getComputedStyle(document.documentElement).getPropertyValue('--colour').trim() || '#ff3b30';
      g.globalAlpha = alpha;
      g.strokeStyle = colour;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.lineWidth = Math.max(4, Math.min(W, H) * 0.06);
      g.shadowColor = 'rgba(0,0,0,0.35)';
      g.shadowBlur = g.lineWidth * 0.8;
      g.shadowOffsetY = g.lineWidth * 0.25;
    }

    window.__render = (t) => {
      const W = (cv.width = innerWidth), H = (cv.height = innerHeight);
      const fade = t < 2.55 ? 1 : Math.max(0, 1 - (t - 2.55) / 0.45);
      pen(W, H, fade);
      // inset by the pen's width, so the whole loop stays inside the box
      const m = (g.lineWidth * 0.9) / Math.min(W, H);
      const ix = (v) => m + v * (1 - 2 * m);
      const P = (x, y) => [ix(x), ix(y)];
      // one loop drawn by hand: it starts a little inside, goes round and overshoots where it began
      const pts = [
        ...bezier(W, H, P(0.6, 0.06), P(0.9, 0.05), P(1, 0.3), P(0.98, 0.52)),
        ...bezier(W, H, P(0.98, 0.52), P(0.96, 0.8), P(0.73, 0.96), P(0.46, 0.95)),
        ...bezier(W, H, P(0.46, 0.95), P(0.18, 0.94), P(0.02, 0.75), P(0.03, 0.5)),
        ...bezier(W, H, P(0.03, 0.5), P(0.04, 0.24), P(0.24, 0.04), P(0.52, 0.04)),
        ...bezier(W, H, P(0.52, 0.04), P(0.64, 0.04), P(0.74, 0.08), P(0.8, 0.14)),
      ];
      strokePart(pts, ease((t - 0.1) / 0.65));
    };
  </script>
</body>
</html>
