<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Checklist</title>
<script type="application/json" id="cutaway-motion">
{
  "name": "Checklist",
  "description": "A card on the right lists three steps; each one ticks off in turn with a pop.",
  "duration": 5,
  "fields": [
    { "id": "item1", "label": "First", "type": "text", "default": "Record your screen" },
    { "id": "item2", "label": "Second", "type": "text", "default": "Cut the pauses" },
    { "id": "item3", "label": "Third", "type": "text", "default": "Export and share" },
    { "id": "accent", "label": "Tick colour", "type": "color", "default": "#22c55e" }
  ],
  "sounds": [{ "t": 0.1, "sound": "swish", "gain": 0.4 }, { "t": 1.1, "sound": "pop", "gain": 0.55 }, { "t": 1.9, "sound": "pop", "gain": 0.55 }, { "t": 2.7, "sound": "pop", "gain": 0.55 }]
}
</script>
<style>
  html, body { width: 100%; height: 100%; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: calc(min(100vw, 100vh) * 0.04); }
  #card { position: absolute; right: 6%; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.96); border-radius: 0.6em; padding: 0.8em 1.1em; box-shadow: 0 0.4em 1.2em rgba(0, 0, 0, 0.35); }
  .item { display: flex; align-items: center; gap: 0.6em; padding: 0.35em 0; font-weight: 650; color: #111; white-space: nowrap; }
  .box { position: relative; width: 1.15em; height: 1.15em; border-radius: 0.3em; box-shadow: inset 0 0 0 0.12em #c9ccd4; flex: none; }
  .fill { position: absolute; inset: 0; border-radius: 0.3em; background: var(--accent); }
  .fill svg { position: absolute; inset: 15%; width: 70%; height: 70%; }
  .fill path { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .label { position: relative; }
  .strike { position: absolute; left: 0; right: 0; top: 52%; height: 0.08em; background: #111; opacity: 0.55; transform-origin: 0 50%; }
</style>
</head>
<body>
  <div id="card">
    <div class="item"><div class="box"><div class="fill"><svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.2 4.2L19 7"/></svg></div></div><span class="label"><span data-field="item1">Record your screen</span><i class="strike"></i></span></div>
    <div class="item"><div class="box"><div class="fill"><svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.2 4.2L19 7"/></svg></div></div><span class="label"><span data-field="item2">Cut the pauses</span><i class="strike"></i></span></div>
    <div class="item"><div class="box"><div class="fill"><svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.2 4.2L19 7"/></svg></div></div><span class="label"><span data-field="item3">Export and share</span><i class="strike"></i></span></div>
  </div>
  <script>
    const D = 5000, at = (s) => s / 5;
    const run = (el, frames) => el.animate(frames, { duration: D, fill: 'both' });
    run(document.getElementById('card'), [
      { offset: 0, transform: 'translate(40%, -50%)', opacity: 0 },
      { offset: at(0.1), transform: 'translate(40%, -50%)', opacity: 0, easing: 'cubic-bezier(.2,.8,.2,1)' },
      { offset: at(0.55), transform: 'translate(0, -50%)', opacity: 1 },
      { offset: at(4.4), transform: 'translate(0, -50%)', opacity: 1, easing: 'ease-in' },
      { offset: 1, transform: 'translate(30%, -50%)', opacity: 0 },
    ]);
    // each step ticks at its moment: the box fills, the tick draws, the words are struck through
    [1.1, 1.9, 2.7].forEach((t, i) => {
      const item = document.querySelectorAll('.item')[i];
      run(item.querySelector('.fill'), [{ offset: 0, transform: 'scale(0)' }, { offset: at(t), transform: 'scale(0)' }, { offset: at(t + 0.12), transform: 'scale(1.15)' }, { offset: at(t + 0.22), transform: 'scale(1)' }, { offset: 1, transform: 'scale(1)' }]);
      const tick = item.querySelector('path');
      tick.style.strokeDasharray = '1 1';
      run(tick, [{ offset: 0, strokeDashoffset: 1 }, { offset: at(t + 0.05), strokeDashoffset: 1 }, { offset: at(t + 0.3), strokeDashoffset: 0 }, { offset: 1, strokeDashoffset: 0 }]);
      run(item.querySelector('.strike'), [{ offset: 0, transform: 'scaleX(0)' }, { offset: at(t + 0.15), transform: 'scaleX(0)' }, { offset: at(t + 0.45), transform: 'scaleX(1)' }, { offset: 1, transform: 'scaleX(1)' }]);
    });
  </script>
</body>
</html>
