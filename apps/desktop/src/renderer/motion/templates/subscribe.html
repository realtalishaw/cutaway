<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Subscribe</title>
<script type="application/json" id="cutaway-motion">
{
  "name": "Subscribe",
  "duration": 4.2,
  "fields": [
    { "id": "label", "label": "Button text", "type": "text", "default": "Subscribe" },
    { "id": "done", "label": "After the click", "type": "text", "default": "Subscribed" },
    { "id": "accent", "label": "Button colour", "type": "color", "default": "#ff0033" }
  ],
  "sounds": [
    { "t": 1.3, "sound": "click", "gain": 0.8 },
    { "t": 1.38, "sound": "pop", "gain": 0.7 }
  ]
}
</script>
<style>
  /* Sizes follow the frame's short side, so it looks right wide, square and tall. */
  html, body { width: 100%; height: 100%; }
  body { font: 700 calc(min(100vw, 100vh) * 0.05) / 1 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; right: 0; top: 66%; display: flex; justify-content: center; align-items: center; gap: 0.5em; }
  #btn { position: relative; height: 2.1em; min-width: 6.6em; padding: 0 1.1em; border-radius: 1.05em; display: grid; place-items: center; background: var(--accent); color: #fff; letter-spacing: 0.01em; box-shadow: 0 0.25em 0.9em rgba(0, 0, 0, 0.35); }
  #btn span { grid-area: 1 / 1; white-space: nowrap; }
  #after { color: #0f0f0f; display: inline-flex; align-items: center; gap: 0.35em; }
  #after svg { width: 0.9em; height: 0.9em; }
  #bell { width: 2.1em; height: 2.1em; border-radius: 50%; background: #f1f1f1; display: grid; place-items: center; box-shadow: 0 0.25em 0.9em rgba(0, 0, 0, 0.35); }
  #bell svg { width: 1.1em; height: 1.1em; }
  #cursor { position: absolute; width: 1.15em; height: 1.15em; left: 50%; top: 66%; margin: 0.6em 0 0 0.9em; filter: drop-shadow(0 0.06em 0.12em rgba(0, 0, 0, 0.5)); }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="stage">
    <div id="btn">
      <span id="before" data-field="label">Subscribe</span>
      <span id="after"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#0f0f0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b data-field="done">Subscribed</b></span>
    </div>
    <div id="bell"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 00-6 6v4l-2 3h16l-2-3V9a6 6 0 00-6-6zm-2.2 15a2.3 2.3 0 004.4 0" fill="#0f0f0f"/></svg></div>
  </div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.3 3.9 7.4-2.7 1.4-3.9-7.4L4 18.6z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <script>
    // Every animation spans the whole 4.2 s; keyframe offsets are moments / 4.2. Cutaway seeks them.
    const D = 4200;
    const at = (s) => s / 4.2;
    const run = (el, frames) => el.animate(frames, { duration: D, fill: 'both' });
    const $ = (id) => document.getElementById(id);

    // the button pops in, is pressed at 1.3 s, and turns grey with the new words
    run($('stage'), [
      { offset: 0, transform: 'scale(0.6)', opacity: 0 },
      { offset: at(0.28), transform: 'scale(1.06)', opacity: 1, easing: 'ease-out' },
      { offset: at(0.45), transform: 'scale(1)' },
      { offset: at(1.27), transform: 'scale(1)' },
      { offset: at(1.33), transform: 'scale(0.92)' },
      { offset: at(1.5), transform: 'scale(1.04)' },
      { offset: at(1.65), transform: 'scale(1)' },
      { offset: at(3.55), transform: 'scale(1)', opacity: 1, easing: 'ease-in' },
      { offset: 1, transform: 'scale(0.85)', opacity: 0 },
    ]);
    run($('btn'), [
      { offset: 0, background: 'var(--accent)' },
      { offset: at(1.32), background: 'var(--accent)' },
      { offset: at(1.4), background: '#e9e9e9' },
      { offset: 1, background: '#e9e9e9' },
    ]);
    run($('before'), [{ offset: 0, opacity: 1 }, { offset: at(1.32), opacity: 1 }, { offset: at(1.4), opacity: 0 }, { offset: 1, opacity: 0 }]);
    run($('after'), [{ offset: 0, opacity: 0, transform: 'translateY(0.3em)' }, { offset: at(1.36), opacity: 0, transform: 'translateY(0.3em)' }, { offset: at(1.55), opacity: 1, transform: 'translateY(0)' }, { offset: 1, opacity: 1 }]);
    // the bell rings after the click
    run($('bell'), [
      { offset: 0, transform: 'scale(0)', opacity: 0 },
      { offset: at(1.6), transform: 'scale(0)', opacity: 0 },
      { offset: at(1.8), transform: 'scale(1.1) rotate(0deg)', opacity: 1 },
      { offset: at(1.95), transform: 'scale(1) rotate(-14deg)' },
      { offset: at(2.1), transform: 'rotate(12deg)' },
      { offset: at(2.25), transform: 'rotate(-8deg)' },
      { offset: at(2.4), transform: 'rotate(0deg)' },
      { offset: 1, transform: 'rotate(0deg)', opacity: 1 },
    ]);
    // the pointer comes in, clicks, and leaves
    run($('cursor'), [
      { offset: 0, transform: 'translate(5em, 3.5em)', opacity: 0 },
      { offset: at(0.55), transform: 'translate(5em, 3.5em)', opacity: 0 },
      { offset: at(0.7), transform: 'translate(4.2em, 3em)', opacity: 1, easing: 'cubic-bezier(.2,.7,.2,1)' },
      { offset: at(1.25), transform: 'translate(0, 0) scale(1)' },
      { offset: at(1.32), transform: 'translate(0, 0) scale(0.82)' },
      { offset: at(1.45), transform: 'translate(0, 0) scale(1)' },
      { offset: at(2.2), transform: 'translate(0.3em, 0.2em)', opacity: 1, easing: 'ease-in' },
      { offset: at(2.6), transform: 'translate(3em, 2.5em)', opacity: 0 },
      { offset: 1, opacity: 0 },
    ]);

    // Confetti: drawn from the time alone (a seeded generator, no clocks), so every frame is the same every render.
    const fx = $('fx');
    const ctx = fx.getContext('2d');
    function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const r = rng(7);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff0033';
    const colours = [accent, '#ffd400', '#00c2ff', '#ff6bd6', '#7cf06b', '#ffffff'];
    const bits = Array.from({ length: 160 }, () => ({
      a: -Math.PI / 2 + (r() - 0.5) * 2.3,
      v: 0.9 + r() * 1.1,
      spin: (r() - 0.5) * 18,
      flutter: 6 + r() * 10,
      c: colours[Math.floor(r() * colours.length)],
      w: 0.6 + r() * 0.8,
      round: r() < 0.25,
      delay: r() * 0.08,
    }));
    window.__render = (t) => {
      const W = (fx.width = Math.round(innerWidth));
      const H = (fx.height = Math.round(innerHeight));
      ctx.clearRect(0, 0, W, H);
      const u = Math.min(W, H) / 1080; // one "pixel" of a 1080-tall frame
      const box = $('btn').getBoundingClientRect();
      const x0 = box.left + box.width / 2;
      const y0 = box.top + box.height / 2;
      for (const b of bits) {
        const s = t - 1.38 - b.delay;
        if (s <= 0 || s > 2.4) continue;
        const k = 2.2; // air drag
        const travel = (1 - Math.exp(-k * s)) / k;
        const x = x0 + Math.cos(b.a) * b.v * 1500 * u * travel;
        const y = y0 + Math.sin(b.a) * b.v * 1500 * u * travel + 900 * u * s * s * 0.5;
        const fade = Math.min(1, (2.4 - s) / 0.6);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(x, y);
        ctx.rotate(b.spin * s);
        ctx.scale(1, Math.cos(b.flutter * s));
        ctx.fillStyle = b.c;
        const sz = 16 * u * b.w;
        if (b.round) { ctx.beginPath(); ctx.arc(0, 0, sz * 0.45, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-sz / 2, -sz / 4, sz, sz / 2);
        ctx.restore();
      }
    };
  </script>
</body>
</html>
