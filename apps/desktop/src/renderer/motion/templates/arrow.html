<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Arrow</title>
<script type="application/json" id="cutaway-motion">
{
  "name": "Arrow",
  "description": "A curved arrow draws itself from the bottom-left of the box to its top-right corner, with a note at its tail. Put the top-right corner on what to point at.",
  "duration": 3,
  "placement": "box",
  "box": { "x": 0.42, "y": 0.42, "w": 0.22, "h": 0.22 },
  "fields": [
    { "id": "colour", "label": "Arrow colour", "type": "color", "default": "#ff3b30" },
    { "id": "note", "label": "Note", "type": "text", "default": "Click here" }
  ],
  "sounds": [{ "t": 0.1, "sound": "swish", "gain": 0.5 }, { "t": 0.72, "sound": "pop", "gain": 0.5 }]
}
</script>
<style>
  html, body { width: 100%; height: 100%; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* the note sits inside the box, at the arrow's tail */
  #note { position: absolute; left: 0; bottom: 0; transform-origin: 0 100%; font: 800 calc(min(100vw, 100vh) * 0.12 + 8px) / 1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff; background: var(--colour); padding: 0.25em 0.5em; border-radius: 0.4em; white-space: nowrap; box-shadow: 0 0.2em 0.5em rgba(0, 0, 0, 0.35); }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="note" data-field="note">Click here</div>
  <script>
    // The stroke is drawn on a canvas in real pixels, so it looks the same in a box of any shape.
    const cv = document.getElementById('cv');
    const g = cv.getContext('2d');
    const ease = (p) => (p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3));
    /** Points along a cubic Bézier in box fractions, as pixels. */
    function bezier(W, H, a, b, c, d, n = 80) {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n, u = 1 - t;
        const x = u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0];
        const y = u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1];
        pts.push([x * W, y * H]);
      }
      return pts;
    }
    /** Stroke the first `frac` of a polyline (by length). Returns the last point drawn and its direction. */
    function strokePart(pts, frac) {
      let total = 0;
      for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      let left = total * frac;
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      let end = pts[0], dir = [1, 0];
      for (let i = 1; i < pts.length && left > 0; i++) {
        const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        const k = Math.min(1, left / seg);
        end = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k];
        dir = [pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]];
        g.lineTo(end[0], end[1]);
        left -= seg;
      }
      g.stroke();
      return { end, dir };
    }
    function pen(W, H, alpha) {
      g.clearRect(0, 0, W, H);
      const colour = getComputedStyle(document.documentElement).getPropertyValue('--colour').trim() || '#ff3b30';
      g.globalAlpha = alpha;
      g.strokeStyle = colour;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.lineWidth = Math.max(4, Math.min(W, H) * 0.06);
      g.shadowColor = 'rgba(0,0,0,0.35)';
      g.shadowBlur = g.lineWidth * 0.8;
      g.shadowOffsetY = g.lineWidth * 0.25;
    }

    window.__render = (t) => {
      const W = (cv.width = innerWidth), H = (cv.height = innerHeight);
      const fade = t < 2.55 ? 1 : Math.max(0, 1 - (t - 2.55) / 0.45);
      pen(W, H, fade);
      const m = (g.lineWidth * 1.2) / Math.min(W, H);
      const ix = (v) => m + v * (1 - 2 * m);
      const P = (x, y) => [ix(x), ix(y)];
      // from the bottom-left, curving up to the tip at the top-right corner
      const pts = bezier(W, H, P(0.04, 0.82), P(0.12, 0.38), P(0.45, 0.12), P(1, 0));
      const p = ease((t - 0.1) / 0.58);
      const { end, dir } = strokePart(pts, p);
      if (p >= 0.999) {
        // the head: two short strokes back from the tip
        const len = Math.hypot(dir[0], dir[1]) || 1;
        const ux = dir[0] / len, uy = dir[1] / len;
        const s = g.lineWidth * 2.6;
        g.beginPath();
        g.moveTo(end[0] - ux * s - uy * s * 0.7, end[1] - uy * s + ux * s * 0.7);
        g.lineTo(end[0], end[1]);
        g.lineTo(end[0] - ux * s + uy * s * 0.7, end[1] - uy * s - ux * s * 0.7);
        g.stroke();
      }
    };
    // the note appears at the tail once the arrow has landed
    document.getElementById('note').animate([
      { offset: 0, opacity: 0, transform: 'scale(0.8)' },
      { offset: 0.75 / 3, opacity: 0, transform: 'scale(0.8)' },
      { offset: 0.95 / 3, opacity: 1, transform: 'scale(1)' },
      { offset: 2.55 / 3, opacity: 1, transform: 'scale(1)' },
      { offset: 1, opacity: 0, transform: 'scale(1)' },
    ], { duration: 3000, fill: 'both' });
  </script>
</body>
</html>
